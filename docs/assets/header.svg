<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">OpenTiger</title>
  <desc id="desc">Reconnaissance, OSINT, and utilities. Thirty-one tools, one terminal.</desc>
  <defs>
    <linearGradient id="brand"><stop stop-color="#ffe75f"/><stop offset="1" stop-color="#ff7418"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b77d28" stroke-opacity=".065"/></pattern>
  </defs>
  <rect width="1280" height="280" rx="16" fill="#0e0d0a"/>
  <rect width="1280" height="280" rx="16" fill="url(#grid)"/>
  <path d="M48 44h22m-22 0v22M1232 44h-22m22 0v22M48 236h22m-22 0v-22M1232 236h-22m22 0v-22" fill="none" stroke="#9f6a25"/>
  <text x="88" y="76" fill="#b7a185" font-family="Consolas,monospace" font-size="14" letter-spacing="4">RECON / OSINT / UTILITIES</text>
  <text x="82" y="164" fill="url(#brand)" font-family="Segoe UI,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="7">OPENTIGER</text>
  <text x="88" y="209" fill="#ddd1bd" font-family="Consolas,monospace" font-size="19">31 tools. One terminal. Your next investigation.</text>
  <path d="M1035 91l-30 48 30 48m36-96-30 48 30 48m36-96-30 48 30 48" fill="none" stroke="url(#brand)" stroke-width="9"/>
</svg>
